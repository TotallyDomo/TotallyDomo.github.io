<!DOCTYPE html>
<html lang="{{ or site.Language.Locale "en" }}">
{{ partial "head.html" . }}
<body>
  {{ partial "header.html" . }}
  <main class="content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="{{ printf "%s?v=%s" ("js/site.js" | relURL) (readFile "static/js/site.js" | crypto.SHA256) }}" defer></script>
</body>
</html>

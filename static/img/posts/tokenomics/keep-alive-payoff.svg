<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">tokenomics/keep-alive-payoff</title><desc id="desc">Illustrative waiting costs for an already-warm 800K-token prefix. The whole pie is the 1.6M TC cold-resume budget. After four hours, keeping warm plus resume costs 400K TC, one quarter of that budget. The other 1.2M TC, 75%, is avoided cost. Scheduled keep-alives every 55 minutes, each costing 80K TC. The modeled step reaches 1.6M TC after 19 keep-alives plus resume, at 1045 minutes. Every read hits. Initial warm-up, extra messages and output overhead are excluded.</desc><rect x="0" y="0" width="1200" height="800" fill="#0d1117"/><text x="1140" y="43" fill="#8b98a9" font-family="Consolas, monospace" font-size="18" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">FIG. 03</text><text x="60" y="94" fill="#e6edf3" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="46" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">The cost of waiting</text><text x="60" y="139" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">800K cached tokens. 1h TTL. Keep-alive every 55 minutes.</text><text x="60" y="178" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Read: 0.1 TC/token. Rewrite: 2 TC/token.</text><text x="60" y="239" fill="#e6edf3" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="29" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">After four hours</text><text x="645" y="239" fill="#e6edf3" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="29" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Longer waits</text><text x="60" y="282" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Cold resume: 1.6M TC</text><path d="M 300 480 L 300.0 325.0 A 155 155 0 0 1 455.0 480.0 Z" stroke="#0d1117" stroke-width="1.2" fill="#dfa06e" /><path d="M 300 480 L 455.0 480.0 A 155 155 0 1 1 299.99999999999994 325.0 Z" stroke="#0d1117" stroke-width="1.2" fill="#baaea0" /><text x="367" y="427" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="31" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">25%</text><text x="250" y="528" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">75%</text><line x1="410" y1="370" x2="435" y2="346" stroke="#dfa06e" stroke-width="1.5" /><text x="439" y="330" fill="#dfa06e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Keep warm</text><text x="439" y="367" fill="#dfa06e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">400K TC</text><line x1="190" y1="590" x2="135" y2="659" stroke="#baaea0" stroke-width="1.5" /><text x="60" y="695" fill="#baaea0" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Avoided cost</text><text x="60" y="735" fill="#baaea0" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="31" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">1.2M TC</text><line x1="670" y1="605.0" x2="1105" y2="605.0" stroke="#2a313c" stroke-width="1" /><text x="656" y="611.0" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">0</text><line x1="670" y1="493.0" x2="1105" y2="493.0" stroke="#2a313c" stroke-width="1" /><text x="656" y="499.0" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">0.8</text><line x1="670" y1="381.0" x2="1105" y2="381.0" stroke="#2a313c" stroke-width="1" /><text x="656" y="387.0" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">1.6</text><text x="670.0" y="636" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">1</text><text x="738.6842105263158" y="636" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">4</text><text x="830.2631578947369" y="636" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">8</text><text x="921.8421052631579" y="636" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">12</text><text x="1013.421052631579" y="636" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">16</text><text x="1105.0" y="636" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">20</text><text x="670" y="282" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Million TC</text><text x="887" y="677" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">Wait / hours</text><line x1="670" y1="381.0" x2="1105" y2="381.0" stroke="#baaea0" stroke-width="2" stroke-dasharray="7 6"/><text x="670" y="367.0" fill="#baaea0" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Cold resume</text><path d="M 670.0 582.6 L 689.078947368421 582.6 L 689.078947368421 571.4 L 710.0657894736842 571.4 L 710.0657894736842 560.2 L 731.0526315789474 560.2 L 731.0526315789474 549.0 L 752.0394736842105 549.0 L 752.0394736842105 537.8 L 773.0263157894736 537.8 L 773.0263157894736 526.6 L 794.0131578947369 526.6 L 794.0131578947369 515.4 L 815.0 515.4 L 815.0 504.2 L 835.9868421052631 504.2 L 835.9868421052631 493.0 L 856.9736842105264 493.0 L 856.9736842105264 481.8 L 877.9605263157895 481.8 L 877.9605263157895 470.6 L 898.9473684210526 470.6 L 898.9473684210526 459.40000000000003 L 919.9342105263158 459.40000000000003 L 919.9342105263158 448.20000000000005 L 940.921052631579 448.20000000000005 L 940.921052631579 437.0 L 961.9078947368421 437.0 L 961.9078947368421 425.79999999999995 L 982.8947368421052 425.79999999999995 L 982.8947368421052 414.6 L 1003.8815789473684 414.6 L 1003.8815789473684 403.4 L 1024.8684210526317 403.4 L 1024.8684210526317 392.19999999999993 L 1045.8552631578948 392.19999999999993 L 1045.8552631578948 380.99999999999994 L 1066.842105263158 380.99999999999994 L 1066.842105263158 369.79999999999995 L 1087.828947368421 369.79999999999995 L 1087.828947368421 358.5999999999999 L 1105.0 358.5999999999999" stroke="#dfa06e" stroke-width="3" fill="none" /><text x="865" y="568" fill="#dfa06e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Keep-alives + resume</text><circle cx="1045.8552631578948" cy="381.0" r="5" fill="#dfa06e" /><text x="1110" y="727" fill="#dfa06e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">Equal cost at 17h 25m</text><text x="1110" y="759" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="19" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">19 keep-alives + resume</text></svg>
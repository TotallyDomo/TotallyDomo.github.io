{{ define "main" }}
  <article class="post">
    <header class="post-header">
      <h1>{{ .Title }}</h1>
      <div class="post-meta">
        {{ if not .Date.IsZero }}
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
          <span aria-hidden="true">&middot;</span>
        {{ end }}
        <span class="reading-time">{{ .ReadingTime }} min read</span>
      </div>
    </header>

    <div class="post-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}

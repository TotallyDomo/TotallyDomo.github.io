<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">tokenomics/context-growth-cost</title><desc id="desc">Area-proportional pies at turns 1, 50 and 100. Total cost is 6K, 10.9K and 15.9K token credits (TC). Reads cost 1.5K, 6.4K and 11.4K TC. Writes stay at 2K and output at 2.5K. Rates: 0.1 TC/read token, 2 TC/write token, 5 TC/output token. After turn one, the 1K writes include the previous response. No cache expiry or compaction.</desc><rect x="0" y="0" width="1200" height="760" fill="#ffffff"/><text x="1140" y="43" fill="#59636e" font-family="Consolas, monospace" font-size="18" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">FIG. 01</text><text x="60" y="94" fill="#1f2328" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="46" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Cost per turn</text><text x="60" y="139" fill="#59636e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Warm 15K prefix. Each turn writes 1K tokens and generates 500.</text><text x="60" y="178" fill="#59636e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Pie area scales with total cost.</text><text x="230" y="244" fill="#1f2328" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">Turn 1</text><text x="230" y="285" fill="#1f2328" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="31" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">6K TC</text><path d="M 230 474 L 230.0 372.64130572239804 A 101.35869427760196 101.35869427760196 0 0 1 331.35869427760196 474.0 Z" stroke="#ffffff" stroke-width="1.2" fill="#dfa06e" /><text x="275.8697088357801" y="435.1302911642199" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">1.5K</text><path d="M 230 474 L 331.35869427760196 474.0 A 101.35869427760196 101.35869427760196 0 0 1 179.32065286119905 561.7792041388237 Z" stroke="#ffffff" stroke-width="1.2" fill="#b9ac94" /><text x="262.4347821688326" y="537.1786906488471" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">2K</text><path d="M 230 474 L 179.32065286119905 561.7792041388237 A 101.35869427760196 101.35869427760196 0 0 1 229.99999999999997 372.64130572239804 Z" stroke="#ffffff" stroke-width="1.2" fill="#798f94" /><text x="167.3408124661288" y="464.21052130190895" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">2.5K</text><text x="590" y="244" fill="#1f2328" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">Turn 50</text><text x="590" y="285" fill="#1f2328" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="31" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">10.9K TC</text><path d="M 590 474 L 590.0 337.384923067463 A 136.61507693253705 136.61507693253705 0 1 1 518.870781092812 590.6375302505002 Z" stroke="#ffffff" stroke-width="1.2" fill="#dfa06e" /><text x="674.1765756010595" y="504.642062916485" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">6.4K</text><path d="M 590 474 L 518.870781092812 590.6375302505002 A 136.61507693253705 136.61507693253705 0 0 1 454.53236713988156 456.33082648907475 Z" stroke="#ffffff" stroke-width="1.2" fill="#b9ac94" /><text x="511.14707168945984" y="518.7737834446159" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">2K</text><path d="M 590 474 L 454.53236713988156 456.33082648907475 A 136.61507693253705 136.61507693253705 0 0 1 590.0 337.384923067463 Z" stroke="#ffffff" stroke-width="1.2" fill="#798f94" /><text x="532.3115279511137" y="415.2985296090508" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">2.5K</text><text x="970" y="244" fill="#1f2328" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">Turn 100</text><text x="970" y="285" fill="#1f2328" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="31" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">15.9K TC</text><path d="M 970 474 L 970.0 309.0 A 165.0 165.0 0 1 1 808.5381787705818 507.98647209228125 Z" stroke="#ffffff" stroke-width="1.2" fill="#dfa06e" /><text x="1052.0009199030253" y="547.5372762822287" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">11.4K</text><path d="M 970 474 L 808.5381787705818 507.98647209228125 A 165.0 165.0 0 0 1 832.244120706612 383.1797504952474 Z" stroke="#ffffff" stroke-width="1.2" fill="#b9ac94" /><text x="866.2548599386737" y="461.29452071996764" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">2K</text><path d="M 970 474 L 832.244120706612 383.1797504952474 A 165.0 165.0 0 0 1 970.0 309.0 Z" stroke="#ffffff" stroke-width="1.2" fill="#798f94" /><text x="919.9332233039174" y="388.02324015505485" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">2.5K</text><rect x="248" y="701" width="15" height="15" fill="#dfa06e"/><text x="275" y="717" fill="#59636e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Cache reads</text><rect x="510" y="701" width="15" height="15" fill="#b9ac94"/><text x="537" y="717" fill="#59636e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Cache writes</text><rect x="790" y="701" width="15" height="15" fill="#798f94"/><text x="817" y="717" fill="#59636e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Output</text></svg>
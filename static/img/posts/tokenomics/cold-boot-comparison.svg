<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">tokenomics/cold-boot-comparison</title><desc id="desc">Cumulative startup-prefix cost only. A 15K prefix costs 178.5K TC over 100 turns. A 45K prefix costs 535.5K TC. Difference 357K TC. Both stay cached. Task-specific tokens are excluded.</desc><rect x="0" y="0" width="1200" height="660" fill="#0d1117"/><text x="1140" y="43" fill="#8b98a9" font-family="Consolas, monospace" font-size="18" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">FIG. 02</text><text x="60" y="94" fill="#e6edf3" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="46" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Startup context cost</text><text x="60" y="139" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">100 turns: one write at 2 TC/token, 99 reads at 0.1 TC/token.</text><text x="110" y="190" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="19" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Cumulative cost / thousand TC</text><line x1="110" y1="548.0" x2="800" y2="548.0" stroke="#2a313c" stroke-width="1" /><text x="89" y="554.0" fill="#8b98a9" font-family="Consolas, monospace" font-size="19" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">0</text><line x1="110" y1="438.0" x2="800" y2="438.0" stroke="#2a313c" stroke-width="1" /><text x="89" y="444.0" fill="#8b98a9" font-family="Consolas, monospace" font-size="19" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">200</text><line x1="110" y1="328.0" x2="800" y2="328.0" stroke="#2a313c" stroke-width="1" /><text x="89" y="334.0" fill="#8b98a9" font-family="Consolas, monospace" font-size="19" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">400</text><line x1="110" y1="218.0" x2="800" y2="218.0" stroke="#2a313c" stroke-width="1" /><text x="89" y="224.0" fill="#8b98a9" font-family="Consolas, monospace" font-size="19" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">600</text><text x="110.0" y="583" fill="#8b98a9" font-family="Consolas, monospace" font-size="19" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">1</text><text x="277.27272727272725" y="583" fill="#8b98a9" font-family="Consolas, monospace" font-size="19" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">25</text><text x="451.51515151515156" y="583" fill="#8b98a9" font-family="Consolas, monospace" font-size="19" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">50</text><text x="625.7575757575758" y="583" fill="#8b98a9" font-family="Consolas, monospace" font-size="19" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">75</text><text x="800.0" y="583" fill="#8b98a9" font-family="Consolas, monospace" font-size="19" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">100</text><text x="455" y="624" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">Model turns</text><line x1="110.0" y1="498.5" x2="800.0" y2="253.47500000000002" stroke="#baaea0" stroke-width="3" /><circle cx="800.0" cy="253.47500000000002" r="4.5" fill="#baaea0" /><text x="866" y="240.47500000000002" fill="#baaea0" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">45K-token prefix</text><text x="866" y="276.475" fill="#baaea0" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="29" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">535.5K TC</text><line x1="110.0" y1="531.5" x2="800.0" y2="449.825" stroke="#dfa06e" stroke-width="3" /><circle cx="800.0" cy="449.825" r="4.5" fill="#dfa06e" /><text x="866" y="436.825" fill="#dfa06e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">15K-token prefix</text><text x="866" y="472.825" fill="#dfa06e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="29" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">178.5K TC</text><line x1="828" y1="253.47500000000002" x2="844" y2="253.47500000000002" stroke="#8b98a9" stroke-width="1.5" /><line x1="838" y1="253.47500000000002" x2="838" y2="449.825" stroke="#8b98a9" stroke-width="1.5" /><line x1="828" y1="449.825" x2="844" y2="449.825" stroke="#8b98a9" stroke-width="1.5" /><line x1="838" y1="351.65" x2="854" y2="351.65" stroke="#8b98a9" stroke-width="1.5" /><text x="866" y="361.65" fill="#dfa06e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">&#916; 357K TC</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc"><title id="title">vibemax-output-style-wont-save-you-money/session-cost-composition</title><desc id="desc">Four proportional-area pies, with area scales separate for tokens and dollars. Source: grid-haiku-t1-blind-r02 and grid-haiku-t1-vibemax-r06. Off: 168145 cached reads, 10017 writes, 3352 output, 66 uncached input, 308 estimated visible tokens. On: 374142 reads, 13473 writes, 4637 output, 130 input, 156.5 estimated visible tokens. Visible text is estimated as characters divided by four. Historical illustrative list rates per million tokens: $0.10 cached read, $2 cache write, $5 output, $1 uncached input. Totals are computed from the usage buckets at those rates, not the harness cost field. Visible text is 2.9% and 0.9% of dollars. Other output includes tool calls and reasoning. These two sessions are not an estimate of the style effect.</desc><rect x="0" y="0" width="1200" height="1070" fill="#ffffff"/><text x="1140" y="43" fill="#59636e" font-family="Consolas, monospace" font-size="18" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">FIG. 01</text><text x="60" y="94" fill="#1f2328" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="46" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Session cost breakdown</text><text x="60" y="139" fill="#59636e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Two demo runs. Visible text estimated from characters.</text><text x="450" y="209" fill="#1f2328" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="27" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">Style off</text><text x="935" y="209" fill="#1f2328" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="27" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">Vibemax on</text><text x="60" y="372" fill="#1f2328" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Billed tokens</text><text x="60" y="407" fill="#59636e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Area = tokens</text><text x="450" y="238" fill="#1f2328" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="29" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">182K tokens</text><path d="M 450 395 L 539.7926553237548 395.6835711758586 A 89.7952572224341 89.7952572224341 0 1 1 530.5695308572767 355.35483740629326 Z" stroke="#ffffff" stroke-width="1.2" fill="#baaea0" /><path d="M 450 395 L 530.5695308572767 355.35483740629326 A 89.7952572224341 89.7952572224341 0 0 1 539.2460189324368 385.083532667616 Z" stroke="#ffffff" stroke-width="1.2" fill="#a28a66" /><path d="M 450 395 L 539.2460189324368 385.083532667616 A 89.7952572224341 89.7952572224341 0 0 1 539.7939822889412 394.52149781983104 Z" stroke="#ffffff" stroke-width="1.2" fill="#798f94" /><path d="M 450 395 L 539.7939822889412 394.52149781983104 A 89.7952572224341 89.7952572224341 0 0 1 539.7939822889412 395.478502180169 Z" stroke="#ffffff" stroke-width="0" fill="#dfa06e" /><path d="M 450 395 L 539.7939822889412 395.478502180169 A 89.7952572224341 89.7952572224341 0 0 1 539.7926553237548 395.6835711758586 Z" stroke="#ffffff" stroke-width="0" fill="#eee9df" /><line x1="539.7952572224341" y1="395" x2="557.7952572224341" y2="395" stroke="#945022" stroke-width="1.5" /><line x1="557.7952572224341" y1="395" x2="557.7952572224341" y2="545" stroke="#945022" str
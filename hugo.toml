baseURL = "https://totallydomo.github.io/"
locale = "en-us"
title = "TotallyDomo"
enableRobotsTXT = true

# No taxonomies (tags/categories) in the scaffold; add them here + a template when needed.
[taxonomies]

[params]
  # Edit these - consumed by the templates and <head>.
  description = "A personal tech blog about AI skills, gamedev, and whatever I'm building."
  author = "Domas"
  github = "https://github.com/TotallyDomo"

[menu]
  [[menu.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 10
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 20

[markup]
  [markup.highlight]
    noClasses = false        # emit CSS classes; colors come from static/css/syntax.css
    style = "github-dark"    # used by: hugo gen chromastyles --style=github-dark

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="725" viewBox="0 0 1200 725" role="img" aria-labelledby="title desc"><title id="title">unity-corpus/spend-split</title><desc id="desc">Composition of recorded spend split at the July 9 public date. Building: 229M of 756M billed tokens (30%) and $346 of $1254 list-price equivalent (28%). Validating and shipping: 527M tokens (70%) and $908 (72%). The two pies use different units and compare shares only, not total area. Work ran on flat-rate subscriptions.</desc><rect x="0" y="0" width="1200" height="725" fill="#0d1117"/><text x="1140" y="43" fill="#8b98a9" font-family="Consolas, monospace" font-size="18" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">FIG. 02</text><text x="60" y="94" fill="#e6edf3" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="46" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Building vs. shipping</text><text x="60" y="139" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Measured through July 13. Split at the July 9 publication date.</text><text x="340" y="232" fill="#e6edf3" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="25" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">Billed tokens</text><text x="340" y="271" fill="#e6edf3" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="29" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">756M tokens</text><path d="M 340 461 L 340.0 306.0 A 155 155 0 0 1 486.51338829164735 511.5848500175791 Z" stroke="#0d1117" stroke-width="1.2" fill="#798f94" /><path d="M 340 461 L 486.51338829164735 511.5848500175791 A 155 155 0 1 1 339.99999999999983 306.0 Z" stroke="#0d1117" stroke-width="1.2" fill="#dfa06e" /><text x="420.6213194213119" y="400.5439049815705" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">30%</text><text x="420.6213194213119" y="431.5439049815705" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">229M</text><text x="259.3786805786881" y="515.4560950184296" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">70%</text><text x="259.3786805786881" y="546.4560950184296" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">527M</text><text x="880" y="232" fill="#e6edf3" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="25" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">List-price equivalent</text><text x="880" y="271" fill="#e6edf3" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="29" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">$1,254</text><path d="M 880 461 L 880.0 306.0 A 155 155 0 0 1 1032.949436709335 486.1290630604706 Z" stroke="#0d1117" stroke-width="1.2" fill="#798f94" /><path d="M 880 461 L 1032.949436709335 486.1290630604706 A 155 155 0 1 1 880.0 306.0 Z" stroke="#0d1117" stroke-width="1.2" fill="#dfa06e" /><text x="955.4651157832517" y="393.9217954385392" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">28%</text><text x="955.4651157832517" y="424.9217954385392" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">$346</text><text x="804.5348842167483" y="522.0782045614608" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">72%</text><text x="804.5348842167483" y="553.0782045614608" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">$908</text><rect x="285" y="667" width="15" height="15" fill="#798f94"/><text x="312" y="683" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Building</text><rect x="600" y="667" width="15" height="15" fill="#dfa06e"/><text x="627" y="683" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Validation + shipping</text></svg>
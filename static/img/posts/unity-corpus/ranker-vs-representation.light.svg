<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">unity-corpus/ranker-vs-representation</title><desc id="desc">Paired-dot comparison transcribed at the original chart precision. Naive scan over raw HTML: 94% all cases and 59% concept pages. Naive scan over derived Markdown: 95% and 62%. BM25 over raw HTML: 97% and 96%. BM25 over the corpus: 97% and 96%. These whole-percent labels must not be read as evidence of exact equality between the BM25 representations.</desc><rect x="0" y="0" width="1200" height="740" fill="#ffffff"/><text x="1140" y="43" fill="#59636e" font-family="Consolas, monospace" font-size="18" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">FIG. 03</text><text x="60" y="94" fill="#1f2328" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="46" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Recall by ranker and representation</text><text x="60" y="139" fill="#59636e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Top-10 recall. 1,008 cases. Values rounded to whole percent.</text><rect x="445" y="185" width="15" height="15" fill="#baaea0"/><text x="472" y="201" fill="#59636e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">All cases</text><rect x="735" y="185" width="15" height="15" fill="#dfa06e"/><text x="762" y="201" fill="#59636e" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Concept pages</text><line x1="350.0" y1="248" x2="350.0" y2="611" stroke="#d1d9e0" stroke-width="1" /><text x="350.0" y="645" fil
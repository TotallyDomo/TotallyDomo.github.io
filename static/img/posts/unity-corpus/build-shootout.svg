<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">unity-corpus/build-shootout</title><desc id="desc">Full-corpus build times from the preserved June 28 manifests. Python 385.7 seconds, including 245.4 seconds rereading output to hash and count it, and 140.3 seconds of other work. C++ 67.6 seconds. Single-threaded Go 62.9 seconds. Eight-worker Go 38.0 seconds. The four finish markers share a linear zero-based seconds axis. The separate pie shows the Python breakdown only. Python was a one-shot implementation.</desc><rect x="0" y="0" width="1200" height="730" fill="#0d1117"/><text x="1140" y="43" fill="#8b98a9" font-family="Consolas, monospace" font-size="18" text-anchor="end" style="font-variant-numeric:lining-nums tabular-nums">FIG. 01</text><text x="60" y="94" fill="#e6edf3" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="46" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">Full-corpus build time</text><text x="60" y="139" fill="#8b98a9" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="start" style="font-variant-numeric:lining-nums tabular-nums">39,056 pages. Identical output. June 28 measurements.</text><text x="270" y="232" fill="#e6edf3" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">Python / 385.7 s</text><path d="M 270 426 L 270.0 276.0 A 150 150 0 1 1 156.710330640984 524.3130246535261 Z" stroke="#0d1117" stroke-width="1.2" fill="#dfa06e" /><text x="357.33943048449726" y="472.84750785988604" fill="#191917" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="23" text-anchor="middle" style="font-variant-numeric:lining-nums tabular-nums">245.4 s</text><path d="M 270 426 L 156.710